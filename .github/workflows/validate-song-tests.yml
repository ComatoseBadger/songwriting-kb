name: Song validator tests
on:
  push:
    paths: ['tools/**', 'tests/**', 'templates/**', '.github/workflows/validate-song-tests.yml']
  pull_request:
    paths: ['tools/**', 'tests/**', 'templates/**', '.github/workflows/validate-song-tests.yml']
permissions:
  contents: read
jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tests -v
